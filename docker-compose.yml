services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buildgate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buildgate}
      POSTGRES_DB: ${POSTGRES_DB:-buildgate}
    ports:
      # Host port is overridable so a Postgres already bound to 5432 on the
      # host does not block startup; containers always reach it as db:5432.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - buildgate_db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buildgate}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://buildgate:buildgate@db:5432/buildgate}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - buildgate_uploads:/data/uploads
      - ./data/demo:/data/demo:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  buildgate_db_data:
  buildgate_uploads:
